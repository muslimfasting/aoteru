# Local PostgreSQL for development: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aoteru
      POSTGRES_PASSWORD: aoteru
      POSTGRES_DB: aoteru
    ports:
      - "5432:5432"
    volumes:
      - aoteru-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoteru"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aoteru-pg:
